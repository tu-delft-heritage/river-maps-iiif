name: Deploy IIIF to GitHub Pages

on:
  push:
    branches: [watertijdreis]
    paths:
      - 'iiif/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# All branches publish to the same site, so serialize their deployments.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check committed data with the Allmaps parsers
        run: pnpm check:allmaps

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Publish the parser-validated committed output without rebuilding it.
      - name: Upload committed website and IIIF JSON
        uses: actions/upload-pages-artifact@v4
        with:
          path: iiif
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
