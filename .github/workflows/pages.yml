name: Deploy IIIF to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'iiif/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# All branches publish to the same site, so serialize their deployments.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # iiif/ is committed build output: publish it without installing or rebuilding.
      - name: Upload committed website and IIIF JSON
        uses: actions/upload-pages-artifact@v4
        with:
          path: iiif
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
